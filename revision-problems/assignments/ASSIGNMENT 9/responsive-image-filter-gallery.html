<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header><h1>Filter Gallery</h1><p>Hover over an image to see its original colors.</p></header>
    <main class="gallery">
        <figure class="blur"><img src="https://picsum.photos/id/1015/500/350" alt="Mountain lake"><figcaption>Blur</figcaption></figure>
        <figure class="grayscale"><img src="https://picsum.photos/id/1025/500/350" alt="Dog portrait"><figcaption>Grayscale</figcaption></figure>
        <figure class="sepia"><img src="https://picsum.photos/id/1035/500/350" alt="River landscape"><figcaption>Sepia</figcaption></figure>
        <figure class="brightness"><img src="https://picsum.photos/id/1043/500/350" alt="Forest path"><figcaption>Brightness</figcaption></figure>
        <figure class="contrast"><img src="https://picsum.photos/id/1050/500/350" alt="Mountain view"><figcaption>Contrast</figcaption></figure>
        <figure class="hue"><img src="https://picsum.photos/id/1069/500/350" alt="Ocean waves"><figcaption>Hue Rotate</figcaption></figure>
    </main>
</body>
</html>
