<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Contact Form</title></head>
<body>
    <h1>Contact Us</h1>
    <form>
        <label>Full Name: <input type="text" name="full-name" placeholder="Enter your full name" required></label><br>
        <label>Email: <input type="email" name="email" placeholder="Enter your email" required></label><br>
        <label>Subject: <input type="text" name="subject" placeholder="Enter subject" required></label><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" placeholder="Write your message" required></textarea><br>
        <button type="submit">Send</button>
    </form>
</body>
</html>
