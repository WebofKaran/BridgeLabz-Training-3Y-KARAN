<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Payment Form</title></head>
<body>
    <h1>Payment Form</h1>
    <form>
        <label>Cardholder Name: <input type="text" name="cardholder-name" required></label><br>
        <label>Card Number: <input type="text" name="card-number" required></label><br>
        <label>Expiry Date: <input type="month" name="expiry-date" required></label><br>
        <label>CVV: <input type="text" name="cvv" required></label><br>
        <button type="submit">Pay Now</button>
    </form>
</body>
</html>
