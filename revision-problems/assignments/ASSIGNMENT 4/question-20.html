<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The title gives the page its browser tab name. -->
    <title>Important Head Elements</title>
    <!-- The charset sets the character encoding. -->
    <meta charset="UTF-8">
    <!-- The description describes the page. -->
    <meta name="description" content="A page showing important HTML head elements.">
    <!-- The author identifies the page creator. -->
    <meta name="author" content="Karan">
    <!-- The base sets the base URL for relative links. -->
    <base href="https://example.com/">
    <!-- The link connects an external resource such as a favicon. -->
    <link rel="icon" href="favicon.ico">
    <!-- The style tag contains CSS rules. -->
    <style></style>
    <!-- The script tag contains JavaScript code. -->
    <script></script>
</head>
<body>
    <h1>Important Head Elements</h1>
</body>
</html>
