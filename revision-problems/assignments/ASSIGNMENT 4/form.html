<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Submit Form</title></head>
<body>
    <h1>Simple Form</h1>
    <form action="result.html" target="result-frame">
        <label>Text: <input type="text" name="text"></label>
        <button type="submit">Submit</button>
    </form>
    <iframe name="result-frame" src="result.html" width="400" height="100" title="Form result"></iframe>
</body>
</html>
