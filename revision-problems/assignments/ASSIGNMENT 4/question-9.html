<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>File Upload</title></head>
<body>
    <h1>Upload an Image</h1>
    <form>
        <input type="file" name="image" accept=".jpg, .png">
        <button type="submit">Upload</button>
    </form>
    <p>Only JPG and PNG image files are allowed.</p>
</body>
</html>
