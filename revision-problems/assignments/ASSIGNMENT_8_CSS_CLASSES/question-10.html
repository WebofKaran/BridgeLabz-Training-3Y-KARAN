<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface | Assignment 8</title>
  <link rel="stylesheet" href="question-10.css">
</head>
<body>
  <header class="app-header"><div><p class="eyebrow">Assignment 8 / Question 10</p><h1>Field notes</h1></div><a href="#form">New note</a></header>
  <main class="app-main"><section class="note-card"><div class="note-copy"><p class="tag">Today / 09:40</p><h2>Make space for the useful things</h2><p>A small, focused interface can make a busy day feel easier to navigate.</p><form id="form" action="#" method="post"><label for="name">Your name</label><input id="name" name="name" type="text" placeholder="Karan" required><label for="note">Add a note</label><textarea id="note" name="note" rows="3" placeholder="Write something worth keeping..."></textarea><div class="form-actions"><button class="primary" type="submit">Save note</button><button class="secondary" type="reset">Clear</button></div></form></div><img src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=700&q=80" alt="Notebook, coffee, and glasses on a desk"></section></main>
  <footer><p>Built as a semantic HTML and CSS exercise.</p></footer>
</body>
</html>
