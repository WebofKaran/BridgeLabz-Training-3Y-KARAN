<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demonstration | Assignment 8</title>
  <link rel="stylesheet" href="question-2.css">
</head>
<body>
  <main class="tooltip-page">
    <p class="eyebrow">Assignment 8 / Question 2</p>
    <h1>Hover glossary</h1>
    <p class="intro">Move across each term to reveal a CSS-only tooltip.</p>
    <section class="tooltip-row" aria-label="Tooltip examples">
      <span class="tip-wrap"><button type="button" aria-label="Search">Search</button><span class="tooltip">Find a page or file</span></span>
      <span class="tip-wrap"><button type="button" aria-label="Save">Save</button><span class="tooltip">Keep this for later</span></span>
      <span class="tip-wrap"><button type="button" aria-label="Share">Share</button><span class="tooltip">Send it to a friend</span></span>
      <span class="tip-wrap"><button type="button" aria-label="Settings">Settings</button><span class="tooltip">Adjust your preferences</span></span>
    </section>
  </main>
</body>
</html>
