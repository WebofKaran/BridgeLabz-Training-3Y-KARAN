<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Place Selection</title></head>
<body>
    <h1>Choose Your Place</h1>
    <label>Country:
        <select name="country"><option selected>India</option><option>Japan</option><option>France</option></select>
    </label><br>
    <label>State:
        <select name="state"><option selected>Karnataka</option><option>Maharashtra</option><option>Delhi</option></select>
    </label><br>
    <label>City:
        <select name="city"><option selected>Bengaluru</option><option>Mumbai</option><option>Delhi</option></select>
    </label><br>
    <label>Favorite Tourist Place:
        <select name="place"><option selected>Mysore Palace</option><option>Red Fort</option><option>Gateway of India</option></select>
    </label>
    <p>My choice is Mysore Palace in Bengaluru, Karnataka, India.</p>
</body>
</html>
