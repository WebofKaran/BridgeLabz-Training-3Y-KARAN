<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Course Registration</title></head>
<body>
    <h1>Course Registration</h1>
    <form>
        <fieldset>
            <legend>Student Details</legend>
            <label>Name: <input type="text" name="name"></label><br>
            <label>Email: <input type="email" name="email"></label><br>
            <label>Course:
                <select name="course">
                    <option value="html">HTML</option><option value="css">CSS</option><option value="javascript">JavaScript</option>
                </select>
            </label><br>
            <button type="submit">Register</button>
        </fieldset>
    </form>
    <h2>Course Schedule</h2>
    <table border="1">
        <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
        <tr><td>Monday</td><td>10:00 AM</td><td>Mr. Sharma</td></tr>
        <tr><td>Wednesday</td><td>2:00 PM</td><td>Ms. Singh</td></tr>
    </table>
</body>
</html>
